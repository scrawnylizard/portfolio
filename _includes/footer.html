<footer class="site-footer">
  <div class="site-footer__inner">
    <div>
      <p class="site-footer__name">{{ site.author or site.title | escape }}</p>
      {% if site.email %}
      <p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
      {% endif %}
    </div>
    <div>
      <p class="site-footer__desc">{{ site.description | escape }}</p>
    </div>
  </div>
</footer>
