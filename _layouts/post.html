---
layout: default
---
<article>

  <header>
    <h1>{{ title | escape }}</h1>
    <p class="text-muted">
      <time datetime="{{ page.date | isoDate }}">{{ page.date | postDate }}</time>
      {% if author %}
        • {{ author }}
      {% endif %}
    </p>
  </header>

  <section>
    {{ content | safe }}
  </section>

</article>
